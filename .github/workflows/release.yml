name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Compilar ejecutable para Windows
    runs-on: windows-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar con PyInstaller
        run: pyinstaller AlbinaAccesorios.spec --clean

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AlbinaPOS_SanMartin.exe
          name: Versión ${{ github.ref_name }}
          body: |
            ## Novedades
            Nueva release estable generada automáticamente.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
